<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Absensi Sekolah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070b14;
            --bg-mid: #0f172a;
            --accent: #22d3ee;
            --accent-soft: rgba(34, 211, 238, 0.15);
            --accent-glow: rgba(34, 211, 238, 0.45);
            --indigo: #6366f1;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.12);
            --card: rgba(15, 23, 42, 0.65);
            --radius: 16px;
            --radius-sm: 10px;
        }

        html[data-theme="light"] {
            --bg-deep: #f4f7fb;
            --bg-mid: #ffffff;
            --accent: #0f766e;
            --accent-soft: rgba(15, 118, 110, 0.1);
            --accent-glow: rgba(15, 118, 110, 0.16);
            --indigo: #4f46e5;
            --text: #102133;
            --text-muted: #5b6b7f;
            --border: rgba(15, 23, 42, 0.12);
            --card: rgba(255, 255, 255, 0.9);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        html[data-theme="light"] body {
            background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
        }

        /* Ambient gradient orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        html[data-theme="light"] .bg-orb {
            opacity: 0.18;
            filter: blur(85px);
        }

        .bg-orb--1 {
            width: min(70vw, 420px);
            height: min(70vw, 420px);
            background: radial-gradient(circle, #0891b2 0%, transparent 70%);
            top: -10%;
            right: -15%;
        }

        html[data-theme="light"] .bg-orb--1 {
            background: radial-gradient(circle, rgba(14, 165, 233, 0.36) 0%, transparent 70%);
        }

        .bg-orb--2 {
            width: min(60vw, 360px);
            height: min(60vw, 360px);
            background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
            bottom: -15%;
            left: -10%;
        }

        html[data-theme="light"] .bg-orb--2 {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.24) 0%, transparent 70%);
        }

        .bg-orb--3 {
            width: min(50vw, 280px);
            height: min(50vw, 280px);
            background: radial-gradient(circle, #0e7490 0%, transparent 70%);
            top: 40%;
            left: 30%;
            opacity: 0.25;
        }

        html[data-theme="light"] .bg-orb--3 {
            background: radial-gradient(circle, rgba(15, 118, 110, 0.22) 0%, transparent 70%);
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(34, 211, 238, 0.2), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(34, 211, 238, 0.35);
            margin-bottom: 1rem;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        html[data-theme="light"] .brand-badge {
            background: linear-gradient(145deg, rgba(14, 165, 233, 0.14), rgba(99, 102, 241, 0.08));
        }

        .brand-badge svg {
            width: 28px;
            height: 28px;
            color: var(--accent);
        }

        .brand h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand p {
            margin: 0.35rem 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .back-company-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.7rem 0.95rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(7, 11, 20, 0.82);
            color: var(--text);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
        }

        html[data-theme="light"] .back-company-btn {
            background: rgba(255, 255, 255, 0.9);
        }

        .back-company-btn svg {
            width: 18px;
            height: 18px;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem 1.5rem;
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        html[data-theme="light"] .card {
            box-shadow:
                0 18px 40px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        @media (min-width: 480px) {
            .card {
                padding: 2rem 1.75rem;
            }
        }

        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.85rem 1rem;
            padding-right: 2.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(7, 11, 20, 0.55);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        html[data-theme="light"] .input-wrap input {
            background: rgba(255, 255, 255, 0.96);
            border-color: rgba(15, 23, 42, 0.12);
            color: #102133;
        }

        html[data-theme="light"] .input-wrap input {
            background: rgba(255, 255, 255, 0.96);
        }

        .input-wrap input::placeholder {
            color: #64748b;
        }

        html[data-theme="light"] .input-wrap input::placeholder {
            color: #94a3b8;
        }

        .input-wrap input:hover {
            border-color: rgba(148, 163, 184, 0.22);
        }

        .input-wrap input:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.55);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .input-icon {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            opacity: 0.7;
        }

        .row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--accent);
            border-radius: 4px;
        }

        .link-muted {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .link-muted:hover {
            opacity: 0.85;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.95rem 1.25rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #042f2e;
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #0891b2 100%);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(34, 211, 238, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        html[data-theme="light"] .btn-primary {
            color: #ecfeff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(34, 211, 238, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-note a {
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        html[data-theme="light"] .footer-note a {
            color: var(--accent);
        }

        .login-error {
            margin: 0 0 1rem;
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fecaca;
            font-size: 0.85rem;
            font-weight: 600;
        }

        html[data-theme="light"] .login-error {
            background: rgba(248, 113, 113, 0.08);
            color: #b91c1c;
        }

        .demo-hint {
            margin-top: 1rem;
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            font-size: 0.72rem;
            line-height: 1.5;
            color: var(--text-muted);
            text-align: left;
        }

        .demo-hint strong {
            color: var(--text);
        }

        .demo-hint code {
            font-size: 0.8em;
            color: var(--accent);
        }

        html[data-theme="light"] .demo-hint {
            background: rgba(15, 118, 110, 0.07);
        }
        .demo-hint,
        .demo-accounts,
        [data-demo-accounts],
        #demo-hint,
        #demo-accounts {
            display: none !important;
        }

        .remember-row,
        .remember-me,
        [data-remember-me] {
            display: none !important;
        }

        .input-wrap.floating-field {
            position: relative;
        }

        .input-wrap.floating-field input {
            padding-top: 1.15rem;
            padding-bottom: 0.55rem;
        }

        .input-wrap.floating-field .floating-label {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            z-index: 2;
            transform: translateY(-50%);
            color: var(--text-muted, #94a3b8);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0 0.35rem;
            border-radius: 999px;
            background: #0d1424;
            pointer-events: none;
            transition: top 0.18s ease, transform 0.18s ease, font-size 0.18s ease, color 0.18s ease;
        }

        .input-wrap.floating-field.is-filled .floating-label,
        .input-wrap.floating-field:focus-within .floating-label {
            top: 0;
            transform: translateY(-50%);
            font-size: 0.68rem;
            color: var(--accent, #22d3ee);
        }

        html[data-theme="light"] .input-wrap.floating-field .floating-label {
            background: #ffffff;
        }

        .input-wrap input:-webkit-autofill,
        .input-wrap input:-webkit-autofill:hover,
        .input-wrap input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text, #f1f5f9);
            box-shadow: 0 0 0 1000px rgba(7, 11, 20, 0.92) inset;
            transition: background-color 9999s ease-out;
        }

        #btn-back-company,
        .back-company-btn {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        #btn-back-company::after,
        .back-company-btn::after {
            content: "";
            position: absolute;
            inset: -35% auto -35% -45%;
            z-index: 1;
            width: 35%;
            transform: skewX(-22deg) translateX(-130%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.68), transparent);
            filter: blur(8px);
            opacity: 0;
            pointer-events: none;
        }

        #btn-back-company:hover::after,
        .back-company-btn:hover::after {
            opacity: 1;
            animation: button-shimmer 0.7s ease-out;
        }

        @keyframes button-shimmer {
            from {
                transform: skewX(-22deg) translateX(-130%);
            }
            to {
                transform: skewX(-22deg) translateX(430%);
            }
        }

        #btn-back-company,
        .back-company-btn {
            border-color: rgba(34, 211, 238, 0.42) !important;
            box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.18);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        #btn-back-company:hover,
        .back-company-btn:hover {
            border-color: rgba(103, 232, 249, 0.72) !important;
            box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.28), 0 0 22px rgba(34, 211, 238, 0.28), inset 0 0 16px rgba(255, 255, 255, 0.06);
        }

        .input-wrap.floating-field {
            border-radius: var(--radius-sm, 10px);
            isolation: isolate;
        }

        .input-wrap.floating-field input {
            position: relative;
            z-index: 1;
            background-clip: padding-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrap.floating-field:hover input,
        .input-wrap.floating-field:focus-within input {
            border-color: rgba(34, 211, 238, 0.7);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .input-wrap.floating-field::after {
            content: "";
            position: absolute;
            z-index: 2;
            width: 34px;
            height: 3px;
            left: 10px;
            top: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.9), transparent);
            box-shadow: 0 0 8px rgba(103, 232, 249, 0.55), 0 0 14px rgba(34, 211, 238, 0.24);
            opacity: 0;
            pointer-events: none;
        }

        .input-wrap.floating-field:hover:not(:focus-within)::after {
            opacity: 1;
            animation: input-border-trace 3.2s linear infinite;
        }

        @keyframes input-border-trace {
            0% {
                left: 10px;
                top: 2px;
                width: 34px;
                height: 3px;
                transform: translate(0, 0);
            }
            12.5% {
                left: calc(100% - 44px);
                top: 2px;
                width: 34px;
                height: 3px;
                transform: translate(0, 0);
            }
            25% {
                left: calc(100% - 5px);
                top: 10px;
                width: 3px;
                height: 34px;
                transform: translate(0, 0);
            }
            37.5% {
                left: calc(100% - 5px);
                top: calc(100% - 44px);
                width: 3px;
                height: 34px;
                transform: translate(0, 0);
            }
            50% {
                left: calc(100% - 44px);
                top: calc(100% - 5px);
                width: 34px;
                height: 3px;
                transform: translate(0, 0);
            }
            62.5% {
                left: 10px;
                top: calc(100% - 5px);
                width: 34px;
                height: 3px;
                transform: translate(0, 0);
            }
            75% {
                left: 2px;
                top: calc(100% - 44px);
                width: 3px;
                height: 34px;
                transform: translate(0, 0);
            }
            87.5% {
                left: 2px;
                top: 10px;
                width: 3px;
                height: 34px;
                transform: translate(0, 0);
            }
            100% {
                left: 10px;
                top: 2px;
                width: 34px;
                height: 3px;
                transform: translate(0, 0);
            }
        }

        .input-wrap.floating-field::after {
            inset: -1px;
            left: auto;
            top: auto;
            width: auto;
            height: auto;
            border-radius: calc(var(--radius-sm, 10px) + 1px);
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 245deg,
                rgba(34, 211, 238, 0.12) 275deg,
                rgba(103, 232, 249, 0.9) 305deg,
                rgba(255, 255, 255, 0.68) 318deg,
                rgba(103, 232, 249, 0.18) 335deg,
                transparent 360deg
            );
            filter: blur(0.4px);
            box-shadow: none;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
        }

        .input-wrap.floating-field:hover:not(:focus-within)::after {
            animation: input-border-spin 2.4s linear infinite;
        }

        @keyframes input-border-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <button type="button" class="back-company-btn" id="btn-back-company" aria-label="Kembali ke company profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
        <span>Kembali</span>
    </button>

    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

    <div class="login-wrap">
        <header class="brand">
            <div class="brand-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2v4" />
                    <path d="M16 2v4" />
                    <rect width="18" height="18" x="3" y="4" rx="2" />
                    <path d="M3 10h18" />
                    <path d="M8 14h.01" />
                    <path d="M12 14h.01" />
                    <path d="M16 14h.01" />
                    <path d="M8 18h.01" />
                    <path d="M12 18h.01" />
                </svg>
            </div>
            <h1>Absensi Sekolah</h1>
            <p>Masuk dengan akun Anda</p>
        </header>

        <main class="card">
            <p id="login-error" class="login-error" role="alert" hidden></p>
            <form id="login-form" class="form-stack" action="#" method="post" novalidate>
                <div>
                    <label class="field-label" for="username">NIS / Email / NPSN</label>
                    <div class="input-wrap">
                        <input id="username" name="username" type="text" autocomplete="username" placeholder="Contoh: hosanna@gmail.com" required>
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                    </div>
                </div>

                <div>
                    <label class="field-label" for="password">Kata sandi</label>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                    </div>
                </div>

                <div class="row-between">
                    <label class="remember">
                        <input type="checkbox" name="remember" value="1">
                        Ingat saya
                    </label>
                    <a class="link-muted" href="#">Lupa sandi?</a>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>
        </main>

        <p class="footer-note">
            Butuh bantuan? Hubungi <a href="#">tata usaha</a>.
        </p>
        <div class="demo-hint" aria-label="Akun database saat ini">
            <strong>Akun dari database saat ini</strong>:<br>
            Siswa: <code>hosanna@gmail.com</code> / <code>ocancan</code> atau NIS <code>00916</code> / <code>ocancan</code>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script>
        (function () {
            var REDIRECT = {
                admin: "admin-dashboard.html",
                user: "user-dashboard.html",
                teacher: "teacher-dashboard.html",
                bk: "bk-dashboard.html"
            };

            /** Ganti dengan validasi API Laravel — ini hanya untuk UI di Laragon */
            // var PLACEHOLDER_DB = {
            //     admin: { password: "admin", role: "admin" },
            //     siswa: { password: "siswa123", role: "user" },
            //     guru: { password: "guru123", role: "teacher" }
            // };

            var existing = AbsensiAuth.get();
            if (existing && existing.role && REDIRECT[existing.role]) {
                location.replace(REDIRECT[existing.role]);
                return;
            }

            var form = document.getElementById("login-form");
            var errEl = document.getElementById("login-error");
            var tataUsahaWa = "https://wa.me/6281325269477";

            function normalizeLoginForm() {
                if (form) form.setAttribute("autocomplete", "off");

                document.querySelectorAll("label, span, p, small, div").forEach(function (el) {
                    var text = (el.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                    if (text === "ingat saya" || text === "remember me") {
                        var row = el.closest(".remember-row, .remember-me, label, div");
                        if (row) row.remove();
                    }
                });

                document.querySelectorAll("label").forEach(function (label) {
                    var raw = (label.textContent || "").replace(/\s+/g, " ").trim();
                    var lower = raw.toLowerCase();
                    if (lower === "username" || lower === "npsn") {
                        label.textContent = "Email / NISN";
                    }
                });

                var usernameInput = document.getElementById("username");
                if (usernameInput) {
                    usernameInput.placeholder = "";
                    usernameInput.setAttribute("autocomplete", "off");
                    usernameInput.setAttribute("autocapitalize", "none");
                    usernameInput.setAttribute("spellcheck", "false");
                }

                var passwordInput = document.getElementById("password");
                if (passwordInput) {
                    passwordInput.setAttribute("autocomplete", "new-password");
                }

                document.querySelectorAll("input").forEach(function (input) {
                    var key = ((input.id || "") + " " + (input.name || "")).toLowerCase();
                    if (key.indexOf("npsn") === -1) return;
                    var block = input.closest(".input-wrap");
                    var parent = block && block.parentElement ? block.parentElement : input.parentElement;
                    if (parent) parent.remove();
                });

                document.querySelectorAll(".input-wrap input").forEach(function (input) {
                    var wrap = input.closest(".input-wrap");
                    if (!wrap || wrap.querySelector(".floating-label")) return;
                    var label = null;
                    if (input.id) {
                        label = document.querySelector('label[for="' + input.id + '"]');
                    }
                    var title = label ? (label.textContent || "").trim() : (input.getAttribute("placeholder") || "");
                    if (!title) return;
                    if (title.toLowerCase() === "username" || title.toLowerCase() === "npsn") {
                        title = "Email / NISN";
                    }
                    if (label) label.style.display = "none";
                    input.placeholder = "";
                    wrap.classList.add("floating-field");
                    var floating = document.createElement("span");
                    floating.className = "floating-label";
                    floating.textContent = title;
                    wrap.appendChild(floating);

                    function syncFilled() {
                        wrap.classList.toggle("is-filled", !!input.value);
                    }
                    input.addEventListener("input", syncFilled);
                    input.addEventListener("change", syncFilled);
                    syncFilled();
                });

                function clearRememberedLoginValues() {
                    document.querySelectorAll("#login-form input").forEach(function (input) {
                        input.value = "";
                        input.dispatchEvent(new Event("input", { bubbles: true }));
                    });
                }

                setTimeout(clearRememberedLoginValues, 80);
                setTimeout(clearRememberedLoginValues, 450);

                document.querySelectorAll("a, button").forEach(function (el) {
                    var text = (el.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                    if (text.indexOf("hubungi tata usaha") === -1) return;
                    if (el.tagName.toLowerCase() === "a") {
                        el.href = tataUsahaWa;
                        el.target = "_blank";
                        el.rel = "noopener";
                    } else {
                        el.type = "button";
                        el.addEventListener("click", function (event) {
                            event.preventDefault();
                            location.href = tataUsahaWa;
                        });
                    }
                });
            }

            normalizeLoginForm();
            document.addEventListener("click", function (event) {
                var target = event.target.closest("a, button, [role='button']");
                if (!target) return;
                var text = (target.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                if (text.indexOf("hubungi tata usaha") === -1) return;
                if (target.tagName.toLowerCase() !== "a") {
                    event.preventDefault();
                    location.href = tataUsahaWa;
                }
            });
            document.getElementById("btn-back-company").addEventListener("click", function () {
                location.href = "companyprofile.html";
            });

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                errEl.hidden = true;
                errEl.textContent = "";

                var username = (document.getElementById("username").value || "").trim();
                var password = document.getElementById("password").value || "";

                if (!username || !password) {
                    errEl.textContent = "Isi Email / NISN dan kata sandi.";
                    errEl.hidden = false;
                    return;
                }

                fetch("login.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        errEl.textContent = data.error;
                        errEl.hidden = false;
                        return;
                    }

                    AbsensiAuth.set({
                        id: data.id,
                        username: data.username,
                        name: data.name,
                        fullName: data.fullName,
                        displayName: data.displayName,
                        role: data.role,
                        tableRole: data.tableRole,
                        kelas: data.kelas,
                        jurusan: data.jurusan,
                        rombel: data.rombel,
                        at: Date.now()
                    });

                    location.href = REDIRECT[data.role];
                })
                .catch(() => {
                    errEl.textContent = "Server error.";
                    errEl.hidden = false;
                });
            });
        })();
    </script>
</body>
</html>
