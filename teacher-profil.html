<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Guru - Absensi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="dashboard-body">
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">Absensi - Guru/Walas</div>
            <nav class="nav-menu" aria-label="Menu utama">
                <a href="teacher-dashboard.html#beranda" data-view="beranda">Beranda</a>
                <div class="nav-group" data-nav-group="absensi">
                    <button type="button" class="nav-group-toggle" data-nav-parent="absensi" data-nav-default="rekap" aria-expanded="false">Absensi</button>
                    <div class="nav-submenu">
                        <a href="teacher-dashboard.html#rekap" data-view="rekap">Rekap Absensi</a>
                        <a href="teacher-dashboard.html#daftar-siswa" data-view="daftar-siswa">Daftar Siswa</a>
                    </div>
                </div>
                <div class="nav-group" data-nav-group="laporan">
                    <button type="button" class="nav-group-toggle" data-nav-parent="laporan" data-nav-default="laporan-inbox" aria-expanded="false">Laporan</button>
                    <div class="nav-submenu">
                        <a href="teacher-dashboard.html#laporan-inbox" data-view="laporan-inbox">Kotak masuk</a>
                        <a href="teacher-dashboard.html#laporan-baru" data-view="laporan-baru">Laporan Baru</a>
                        <a href="teacher-dashboard.html#laporan-riwayat" data-view="laporan-riwayat">Riwayat Laporan</a>
                    </div>
                </div>
                <a href="teacher-profil.html" aria-current="page">Profil</a>
            </nav>
            <div class="sidebar-footer">
                <button type="button" class="btn-logout" id="btn-logout">Keluar</button>
            </div>
        </aside>

        <main class="main-area">
            <div class="dashboard-topbar">
                <div class="toolbar-heading">
                    <h1 class="page-title">Profil</h1>
                    <p class="page-sub" style="margin-bottom:0">Data akun guru / wali kelas.</p>
                </div>
                <a id="header-avatar-link" href="teacher-profil.html" class="avatar-btn" title="Profil" aria-label="Buka profil">
                    <img id="header-avatar-img" class="hidden" alt="">
                    <span id="header-avatar-fallback" class="avatar-initials">GU</span>
                </a>
            </div>

            <section class="panel view-panel">
                <div class="profile-avatar-edit">
                    <div class="profile-avatar-large">
                        <img id="profil-avatar-img" class="hidden" alt="">
                        <span id="profil-avatar-ph">GU</span>
                    </div>
                    <div class="input-wrap">
                        <input type="file" id="profil-foto-input" accept="image/*">
                    </div>
                    <p id="profil-msg" class="page-sub hidden" style="margin:0;color:var(--success)">Tersimpan.</p>
                </div>

                <form id="profil-form" class="stack" style="margin-top:1.25rem">
                    <div>
                        <span class="field-label">Nama lengkap</span>
                        <div class="input-wrap"><input type="text" id="profil-nama-lengkap" required></div>
                    </div>
                    <div>
                        <span class="field-label" id="profil-identifier-label">NPSN</span>
                        <div class="input-wrap"><input type="text" id="profil-identifier" required></div>
                    </div>
                    <div>
                        <span class="field-label">Email</span>
                        <div class="input-wrap"><input type="email" id="profil-email" required></div>
                    </div>
                    <div>
                        <span class="field-label">Password</span>
                        <div class="input-wrap"><input type="text" id="profil-password" required></div>
                    </div>
                    <button type="submit" class="btn-primary">Simpan perubahan akun</button>
                </form>
            </section>
        </main>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="dashboard-avatar.js"></script>
    <script src="profile-form.js"></script>
    <script>
        AbsensiProfileForm.init({
            role: "teacher",
            roles: ["teacher"],
            profileHref: "teacher-profil.html",
            fallbackInitials: "GU"
        });
    </script>
</body>
</html>
